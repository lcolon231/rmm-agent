name: CI

# Run the agent (Go) and server (Python) test suites on every push and PR.
# This is the gate the release workflow assumes has already passed on main.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-targets:
    name: release target matrix (issue #116)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release targets match the declared support matrix
        run: python3 tools/check_release_targets.py

  agent:
    name: agent (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: agent/go.sum
      - name: gofmt (must be clean)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      # The Windows probe embeds a PowerShell script that nothing else runs:
      # go test never calls RebootPending, which needs a real registry. This
      # parses and executes the script against stubbed registry state, so a
      # defect in it fails here rather than on an endpoint.
      - name: reboot probe script behavior
        shell: pwsh
        run: pwsh -File test/reboot_probe_script.ps1

  agent-windows:
    name: agent (Go, Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: agent/go.sum
      - run: go build ./...
      - run: go test ./...

  windows-lifecycle:
    name: windows service + installer lifecycle
    needs: agent-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: agent/go.sum

      # Stamped like a release build: the installer compile below refuses any
      # binary whose embedded version differs from NODELINK_VERSION (issue
      # #179), so CI exercises that guard on every run.
      - name: Build the Windows agent
        working-directory: agent
        run: |
          $env:GOOS = 'windows'; $env:GOARCH = 'amd64'
          go build -ldflags "-X main.version=0.0.0-ci" -o bin/rmm-agent-windows-amd64.exe ./cmd/agent

      - name: Verify the embedded agent version
        working-directory: agent
        run: .\bin\rmm-agent-windows-amd64.exe version -expect 0.0.0-ci

      # GitHub windows-latest runners run elevated, so the SCM operations the
      # agent performs (register/start/stop/delete a service) are permitted.
      - name: Service lifecycle (install/start/stop/restart/uninstall)
        shell: pwsh
        run: agent/test/service_lifecycle.ps1 -Exe (Resolve-Path agent/bin/rmm-agent-windows-amd64.exe)

      - name: Validate installer contract tests
        run: python -m unittest discover -s installer/test -p "test_*.py"

      # A second, newer stamped build so the installer lifecycle below can
      # upgrade one release over another.
      - name: Build the next Windows agent (upgrade target)
        working-directory: agent
        run: |
          $env:GOOS = 'windows'; $env:GOARCH = 'amd64'
          go build -ldflags "-X main.version=0.0.1-ci" -o bin/rmm-agent-windows-amd64-next.exe ./cmd/agent

      # Pinned to the 6.x line to match installer/NodeLinkAgent.iss and the
      # release workflow (bump both together when moving to IS7).
      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 -y

      # Both installers point at an unreachable .invalid host: the service the
      # lifecycle test starts must never contact production (issue #288). The
      # release workflow compiles without this override.
      - name: Compile the installers
        working-directory: installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $server = '/DProductionServerURL=https://nodelink-ci.invalid'
          $env:NODELINK_VERSION = '0.0.0-ci'
          & $iscc $server /DAgentExe=..\agent\bin\rmm-agent-windows-amd64.exe NodeLinkAgent.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited $LASTEXITCODE" }
          $env:NODELINK_VERSION = '0.0.1-ci'
          & $iscc $server /DAgentExe=..\agent\bin\rmm-agent-windows-amd64-next.exe NodeLinkAgent.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited $LASTEXITCODE" }

      # Sidecar-only token, /TOKEN over sidecar, tokenless upgrade that keeps
      # identity.json/config.json byte-identical, then uninstall.
      - name: Installer lifecycle (sidecar, /TOKEN, upgrade, uninstall)
        shell: pwsh
        run: >-
          installer/test/installer_lifecycle.ps1
          -SetupV1 (Resolve-Path installer/Output/NodeLinkAgentSetup-0.0.0-ci.exe)
          -SetupV2 (Resolve-Path installer/Output/NodeLinkAgentSetup-0.0.1-ci.exe)
          -V2Version 0.0.1-ci
          -ServerURL https://nodelink-ci.invalid

  server:
    name: server (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rmm
          POSTGRES_PASSWORD: rmm
          POSTGRES_DB: rmm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rmm -d rmm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://rmm:rmm@127.0.0.1:5432/rmm_test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio httpx aiosqlite "moto[s3]" "jsonschema==4.25.1"
      - name: Generate command signing key (tests need it)
        run: python scripts/gen_command_keys.py
      - name: Run tests
        run: pytest -q

  dashboard:
    name: dashboard (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    env:
      NODELINK_API_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate configuration
        run: npm run validate:env
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Page-load smoke test
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/nodelink-dashboard.log 2>&1 &
          dashboard_pid=$!
          trap 'kill "$dashboard_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/login | grep -q "Sign in to operations"; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nodelink-dashboard.log
          exit 1
