name: Release

# Cut a versioned agent release. A tag is publishable only when its
# version-controlled release-notes/<tag>.json manifest passes preflight and the
# finalized evidence matches every built artifact. The server runs from source,
# so the server tag and commit are recorded while only agent/installer binaries
# are attached to the GitHub Release.

on:
  push:
    tags: ['v*']

permissions:
  contents: write       # create the GitHub Release
  id-token: write       # keyless signing for build-provenance attestations
  attestations: write   # store the attestations

jobs:
  release-notes-preflight:
    name: validate release-specific notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require a complete manifest for this tag
        run: |
          python3 server/scripts/validate_release_notes.py \
            --manifest "release-notes/${GITHUB_REF_NAME}.json" \
            --tag "$GITHUB_REF_NAME" \
            --phase preflight

  test:
    name: test before release
    needs: release-notes-preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: agent/go.sum
      - run: go vet ./...
      - run: go test ./...

  build:
    name: build agent release artifacts
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: agent/go.sum

      - name: Derive version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9A-Za-z.+-]+$ ]]; then
            echo "::error::Refusing unsafe release tag: ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cross-build all targets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./build.sh "$VERSION"

      # SPDX SBOM over the whole repo captures the Go agent and Python server.
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: agent/bin/nodelink-${{ steps.version.outputs.version }}.spdx.json

      # A future signing step must remain before checksums and attestations.
      - name: Checksums
        working-directory: agent/bin
        run: |
          sha256sum \
            rmm-agent-windows-amd64.exe \
            rmm-agent-linux-amd64 \
            rmm-agent-darwin-arm64 \
            "nodelink-${{ steps.version.outputs.version }}.spdx.json" \
            > SHA256SUMS.txt

      - name: Attest build provenance (agent binaries)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            agent/bin/rmm-agent-windows-amd64.exe
            agent/bin/rmm-agent-linux-amd64
            agent/bin/rmm-agent-darwin-arm64

      - name: Stage agent release artifacts
        run: |
          mkdir -p ../release-output
          cp \
            bin/rmm-agent-windows-amd64.exe \
            bin/rmm-agent-linux-amd64 \
            bin/rmm-agent-darwin-arm64 \
            "bin/nodelink-${{ steps.version.outputs.version }}.spdx.json" \
            bin/SHA256SUMS.txt \
            ../release-output/

      - name: Retain agent artifacts for final validation
        uses: actions/upload-artifact@v4
        with:
          name: release-agent-${{ github.ref_name }}
          path: release-output/*
          if-no-files-found: error
          retention-days: 7

  installer:
    name: build windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: agent/go.sum

      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9A-Za-z.+-]+$ ]]; then
            echo "::error::Refusing unsafe release tag: ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build windows/amd64 agent
        working-directory: agent
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -ldflags "-s -w -X main.version=$env:VERSION" -o bin/rmm-agent-windows-amd64.exe ./cmd/agent

      # Pinned to the 6.x line to match installer/NodeLinkAgent.iss.
      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 -y

      - name: Compile installer
        working-directory: installer
        env:
          NODELINK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" NodeLinkAgent.iss

      - name: Checksum the installer
        working-directory: installer/Output
        shell: pwsh
        run: |
          $f = "NodeLinkAgentSetup-${{ steps.version.outputs.version }}.exe"
          (Get-FileHash $f -Algorithm SHA256).Hash.ToLower() + "  " + $f |
            Out-File -Encoding ascii "$f.sha256"

      - name: Attest build provenance (installer)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: installer/Output/NodeLinkAgentSetup-${{ steps.version.outputs.version }}.exe

      - name: Stage installer release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-output | Out-Null
          $files = @(
            "installer/Output/NodeLinkAgentSetup-${{ steps.version.outputs.version }}.exe"
            "installer/Output/NodeLinkAgentSetup-${{ steps.version.outputs.version }}.exe.sha256"
          )
          Copy-Item -LiteralPath $files -Destination release-output

      - name: Retain installer artifacts for final validation
        uses: actions/upload-artifact@v4
        with:
          name: release-installer-${{ github.ref_name }}
          path: release-output/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: finalize evidence and publish
    needs: [build, installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all built release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*-${{ github.ref_name }}
          path: release-artifacts
          merge-multiple: true

      - name: Derive version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9A-Za-z.+-]+$ ]]; then
            echo "::error::Refusing unsafe release tag: ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Finalize release notes and immutable evidence
        run: |
          source_sha="$(git rev-parse HEAD)"
          python3 server/scripts/validate_release_notes.py \
            --manifest "release-notes/${GITHUB_REF_NAME}.json" \
            --tag "$GITHUB_REF_NAME" \
            --phase finalize \
            --artifact-dir release-artifacts \
            --source-sha "$source_sha" \
            --repository "$GITHUB_REPOSITORY" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output-notes release-artifacts/RELEASE-NOTES.md \
            --output-evidence \
              "release-artifacts/release-evidence-${{ steps.version.outputs.version }}.json"

      # This is the only GitHub Release publication step. It cannot run until
      # both platform builds and final release-evidence validation succeed.
      - name: Publish validated GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-artifacts/RELEASE-NOTES.md
          generate_release_notes: false
          files: |
            release-artifacts/rmm-agent-windows-amd64.exe
            release-artifacts/rmm-agent-linux-amd64
            release-artifacts/rmm-agent-darwin-arm64
            release-artifacts/nodelink-${{ steps.version.outputs.version }}.spdx.json
            release-artifacts/SHA256SUMS.txt
            release-artifacts/NodeLinkAgentSetup-${{ steps.version.outputs.version }}.exe
            release-artifacts/NodeLinkAgentSetup-${{ steps.version.outputs.version }}.exe.sha256
            release-artifacts/RELEASE-NOTES.md
            release-artifacts/release-evidence-${{ steps.version.outputs.version }}.json
