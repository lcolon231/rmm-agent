# Typecheck gate for the CI `server-lint` job: a typed island, not the whole
# app. These modules decide the tenant boundary and the audit chain, where a
# wrong type is a security defect. Grow the list by adding files that pass.
[mypy]
python_version = 3.12
files =
    app/core/tenant_scope.py,
    app/core/clientip.py,
    app/core/audit.py,
    app/api/tenant_access.py
# Check only the listed files; imported app modules are read for their types
# but not reported on until they join the island.
follow_imports = silent
ignore_missing_imports = True
